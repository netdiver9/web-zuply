<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인과 인증</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE  everyday learning: calm, precise, a little playful in motion
   IDEA   a working switchboard: messages are tokens that glide between real machines
   PICTURE the live diagram, phones / gateways / registry / store drawn as soft blocks, packets travelling
   COLOUR white ground, ink #0b0b10, signal green #00a862 band, mist #eafaf2 stage; night #07130d
   TYPE   Space Grotesk for figures, IBM Plex Sans KR for Korean text
   LAYOUT laptop: stage 2/3 + step panel 1/3; phone: title, stage, panel; reel mode: 9:16 frame */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#07130d);--ink:light-dark(#0b0b10,#e9f3ee);--muted:light-dark(#56615b,#9db3a8);
--green:#00a862;--green-ink:light-dark(#00754a,#3fd897);--mist:light-dark(#eafaf2,#0c2018);--line:light-dark(#d3e5db,#1f3a2d);
--face:light-dark(#ffffff,#1c3128);--side:light-dark(#c4d6cc,#08140f);--edge:light-dark(#b6cdc0,#2f5141);
--gw:light-dark(#d4f4e4,#11402d);--gw-edge:light-dark(#8fd8b4,#1f6a4a);--gw-side:light-dark(#6cc79c,#062619);
--store:light-dark(#1f2c26,#cfe9db);--store-top:light-dark(#43564c,#f2fbf6);--screen:light-dark(#1f2c26,#0a1611);
--wire:light-dark(#a9c5b6,#2d5241);--pk:light-dark(#0b0b10,#f2fbf6);--pk-ink:light-dark(#ffffff,#07130d);
--red:#e5484d;
--w1:light-dark(#ffffff,#2c4037);--w2:light-dark(#edf4f0,#24372e);--w3:light-dark(#d9e6df,#1a2a23);--w4:light-dark(#bed0c6,#111d18);
--g1:light-dark(#e2f9ee,#23714f);--g2:light-dark(#bfeed6,#1b5a3f);--g3:light-dark(#8fdbb5,#134430);--g4:light-dark(#5ec393,#0b3222);
--v1:light-dark(#f0ebff,#4a3f80);--v2:light-dark(#dcd2fc,#3b316b);--v3:light-dark(#bfb0f3,#2c2552);--v4:light-dark(#a08de6,#1f1a3d);
--a1:light-dark(#fff3dc,#6e521d);--a2:light-dark(#ffe0aa,#5c4418);--a3:light-dark(#ffc976,#453210);--a4:light-dark(#f0a843,#33250b);
--k1:light-dark(#62786d,#f2fbf6);--k2:light-dark(#3f5148,#d3eadf);--k3:light-dark(#2c3a33,#a9cab9);--k4:light-dark(#1c2722,#86ad9a);
--ol:light-dark(#1b2a22,#020604);--b1:light-dark(#eef5ff,#2d4a78);--b2:light-dark(#d3e5fd,#25406a);--b3:light-dark(#a9c8f3,#1b3154);--b4:light-dark(#86afe8,#132440);
--m1:light-dark(#f6f8fa,#6a747e);--m2:light-dark(#d9dfe4,#525b64);--m3:light-dark(#c9d1d7,#424a52);--m4:light-dark(#9ea9b2,#2c3238);
--p1:light-dark(#3a4047,#4a5159);--p2:light-dark(#22272c,#2d3238);--p3:light-dark(#15191c,#15191c);--p4:light-dark(#15191c,#15191c);
--sc1:light-dark(#ffffff,#f1f6f3);--sc2:light-dark(#e9f1ed,#d7e5de);
--lane:light-dark(#d2e9dd,#14291f);--grid:light-dark(#d8ebe1,#10241a);--amber:#f5a300;--shadow:light-dark(rgba(10,50,30,.10),rgba(0,0,0,.42))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 'IBM Plex Sans KR',system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.band{padding-block:clamp(24px,3.5vw,48px);padding-left:max(5vw,16px);padding-right:max(5vw,16px)}
.top{background:var(--green);color:#fff;display:flex;flex-wrap:wrap;gap:18px 32px;align-items:end;justify-content:space-between}
.top h1{font:700 clamp(32px,5vw,50px)/1.05 'Space Grotesk','IBM Plex Sans KR',sans-serif;letter-spacing:-.02em;margin:0}
.top p{margin:10px 0 0;max-width:46ch;opacity:.92}
.ctl{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid currentColor;background:transparent;font-weight:600;transition:background .2s,color .2s,transform .15s}
.btn:active{transform:scale(.97)}
.top .btn{color:#fff}
.top .btn.solid{background:#fff;color:#00754a;border-color:#fff}
.main{display:grid;gap:28px;max-width:1340px;margin-inline:auto}
@media(min-width:900px){.main{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);align-items:start}}
.mets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.met{border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.met span{display:block;font-size:13px;color:var(--muted)}
.met b{display:block;font:700 clamp(18px,2.2vw,24px)/1.2 'Space Grotesk','IBM Plex Sans KR',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.met b.good{color:var(--green-ink)}.met b.bad{color:var(--red)}
.met b.flip{animation:flip .5s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.note-s{font-size:13px;color:var(--muted);margin:8px 2px 0}
.slot{position:relative;height:clamp(400px,58vh,620px)}
#stage{position:absolute;inset:0;border-radius:22px;background:repeating-linear-gradient(30deg,transparent 0 33px,var(--grid) 33px 34px),repeating-linear-gradient(150deg,transparent 0 33px,var(--grid) 33px 34px),var(--mist);overflow:hidden}
#dia{position:absolute;inset:0;width:100%;height:100%}
.panel{display:flex;flex-direction:column;gap:14px}
@media(min-width:900px){.panel{position:sticky;top:20px}}
.segs{display:flex;gap:6px}
.seg{flex:1;height:28px;border:0;background:none;padding:0;display:flex;align-items:center}
.seg i{display:block;width:100%;height:6px;border-radius:9px;background:var(--line);position:relative;overflow:hidden}
.seg i::after{content:"";position:absolute;inset:0;background:var(--green);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.seg.done i::after{transform:none}
.num{margin:0;font:500 15px 'Space Grotesk','IBM Plex Sans KR',sans-serif;color:var(--green-ink)}
.panel h2{font:700 clamp(26px,3vw,34px)/1.12 'Space Grotesk','IBM Plex Sans KR',sans-serif;letter-spacing:-.02em;margin:0;text-wrap:balance}
.panel p{margin:0}
.fade{animation:flip .55s cubic-bezier(.2,.8,.2,1)}
.key{background:var(--mist);border-radius:16px;padding:14px 16px}
.key b{display:block;color:var(--green-ink);margin-bottom:2px}
.nav{display:flex;gap:10px}
.nav .btn{flex:1}
.nav .btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toc{max-width:1340px;margin-inline:auto;padding-top:0}
.toc h2{font:700 26px/1.2 'Space Grotesk','IBM Plex Sans KR',sans-serif;margin:0 0 14px}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.toc button{width:100%;text-align:left;border:1px solid var(--line);border-radius:16px;background:var(--bg);padding:14px 16px;min-height:44px;transition:border-color .2s,background .2s}
.toc button:hover{border-color:var(--green)}
.toc button.cur{background:var(--mist);border-color:var(--green)}
.toc small{display:block;font:500 13px 'Space Grotesk',sans-serif;color:var(--green-ink)}
.toc strong{display:block}
.toc span{display:block;font-size:14px;color:var(--muted)}
.toc em{display:block;font:600 15px/1.35 'Space Grotesk',sans-serif;font-style:normal;color:var(--green-ink);margin-bottom:4px}
.toc span.en{font-family:'Space Grotesk',sans-serif;margin-top:2px}
.h2en{font-weight:500;color:var(--muted);font-size:.7em}
@media(max-width:600px){.mets{grid-template-columns:repeat(2,minmax(0,1fr))}.slot{height:600px}.top .ctl{width:100%}.top .btn{flex:1}}
.home{display:inline-block;color:#fff;text-decoration:none;font:600 14px 'Space Grotesk',sans-serif;opacity:.9;margin-bottom:10px}.home:hover{opacity:1;text-decoration:underline}
/* svg */
.zn rect{fill:color-mix(in srgb,var(--green) 6%,transparent);stroke:color-mix(in srgb,var(--green) 55%,transparent);stroke-width:1.5;stroke-dasharray:7 6}.zn text{font:700 12px 'Space Grotesk',sans-serif;letter-spacing:.1em;fill:var(--green-ink)}.zn.core rect{fill:color-mix(in srgb,#7c5cff 7%,transparent);stroke:color-mix(in srgb,#7c5cff 55%,transparent)}.zn.core text{fill:light-dark(#4a3a9c,#c9b8ff)}
.e{opacity:0;transition:opacity .45s}.e.on{opacity:1}
.ln{fill:none;stroke:var(--lane);stroke-linecap:round;transition:stroke .3s}
.cl{fill:none;stroke:var(--wire);stroke-width:2;stroke-dasharray:.1 9;stroke-linecap:round;transition:stroke .3s}
.e.d .ln{opacity:.5}.e.d .cl{stroke-dasharray:6 8}
.e.x .ln{stroke:color-mix(in srgb,var(--red) 22%,var(--lane))}.e.x .cl{stroke:var(--red);stroke-dasharray:3 8}
.e.hot .ln{stroke:var(--g2)}.e.hot .cl{stroke:var(--green)}
.nd{opacity:0;transform:scale(.5) translateY(20px);transform-box:fill-box;transform-origin:center bottom;transition:opacity .45s,transform .7s cubic-bezier(.34,1.56,.64,1)}
.nd.on{opacity:1;transform:none}
.bd{transform-box:fill-box;transform-origin:center bottom;transition:opacity .4s}
.bd.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{35%{transform:translateY(-5px) scale(1.04)}}
.nd.off .bd{opacity:.32}.nd.dead .bd{opacity:.4}
.xm{opacity:0;transition:opacity .3s}.nd.dead .xm{opacity:1}
.sh,.psh{fill:var(--shadow)}
.tf{stroke:light-dark(rgba(255,255,255,.9),rgba(255,255,255,.14));stroke-width:1.2}
.gl{font:700 15px 'Space Grotesk','IBM Plex Sans KR',sans-serif;text-anchor:middle;dominant-baseline:central}
.gl-g{fill:light-dark(#0b5e3c,#e4fff1)}.gl-v{fill:light-dark(#4a3a9c,#f0ecff)}.gl-a{fill:light-dark(#7a4b00,#fff3dc)}
.lbl{font:600 13px 'Space Grotesk','IBM Plex Sans KR',sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.lblb{fill:var(--w1);stroke:var(--ol);stroke-width:1.4}
.ol{stroke:var(--ol);stroke-width:1.6;stroke-linejoin:round}.tf.ol{stroke:var(--ol);stroke-width:1.6}
.olt{stroke:var(--ol);stroke-width:.8}
.sheen{fill:#fff;opacity:light-dark(.35,.08);pointer-events:none}
.rim{fill:none;stroke:var(--b1);stroke-width:1.2;opacity:.7}
.ft{font:600 13px 'IBM Plex Sans KR',sans-serif;text-anchor:middle;dominant-baseline:central}
.ft-g{fill:light-dark(#0b4a30,#eafff3)}.ft-v{fill:light-dark(#3a2c86,#f3efff)}.ft-a{fill:light-dark(#5e3a00,#fff5e2)}.ft-k{fill:light-dark(#f3faf6,#0b130f)}
.ic-k{stroke:light-dark(#f3faf6,#0b130f)}.ic-b{stroke:light-dark(#1d3a6b,#eef5ff)}.ft-b{fill:light-dark(#1d3a6b,#eef5ff)}
.m-l{fill:var(--m3)}.m-r{fill:var(--m4)}
.vent{fill:#1d252b;opacity:.55}.seam{stroke:var(--ol);stroke-width:1.2}.hole{fill:#1d252b;opacity:.35}
.lcd{fill:#101820;stroke:var(--ol);stroke-width:.8}.door{fill:#2a333b;stroke:var(--ol);stroke-width:.8}.bay{fill:#4a5661;stroke:#11171c;stroke-width:.6}
.mast{stroke:var(--ol);stroke-width:2.4;stroke-linecap:round}.wave{fill:none;stroke:#f29a00;stroke-width:2;stroke-linecap:round}
.btnk{fill:#15191c}.hdr{stroke:light-dark(#dde6e1,#c4d3cb);stroke-width:1}.b3{fill:light-dark(#9fb0a7,#7d9087)}.inp{fill:none;stroke:light-dark(#c9d6cf,#a8bab0);stroke-width:1}
.key{fill:#eef2f4;stroke:#0f1316;stroke-width:.4}.keyA{fill:#ffc233}
.chip{font:700 14px 'Space Grotesk',sans-serif;fill:#55616b;text-anchor:middle;dominant-baseline:central}
.scrt{font:600 13px 'Space Grotesk',sans-serif;fill:#e8f3ee}
.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.glare{fill:#fff;opacity:.22;pointer-events:none}
.ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-g{stroke:light-dark(#0b5e3c,#e4fff1)}.ic-v{stroke:light-dark(#4a3a9c,#f0ecff)}.ic-a{stroke:light-dark(#7a4b00,#fff3dc)}
.scr{fill:light-dark(#f6faf8,#dfeee6)}.b2{fill:light-dark(#dfe8e3,#b9cdc3);stroke:var(--ol);stroke-width:.8}
.f-red{fill:var(--red)}.xl{stroke:#fff;stroke-width:2.5;stroke-linecap:round}
.pk rect.b{fill:var(--w1);stroke:var(--ol);stroke-width:1.4}.pk rect.s{fill:var(--ol)}
.pk text{fill:var(--ink);font:600 13px 'Space Grotesk','IBM Plex Sans KR',sans-serif;text-anchor:middle;dominant-baseline:central}
.pk.ack rect.b{fill:#00b56a;stroke:var(--ol);stroke-width:1.4}.pk.ack rect.s{fill:var(--ol)}.pk.ack text{fill:#fff}
.pk.push rect.b{fill:#ffb52e;stroke:var(--ol);stroke-width:1.4}.pk.push rect.s{fill:var(--ol)}.pk.push text{fill:#2a1a00}
.pk.beat rect.b{fill:var(--g2);stroke:var(--ol);stroke-width:1.4}.pk.beat rect.s{fill:var(--ol)}.pk.beat text{fill:light-dark(#0b5e3c,#e4fff1)}
.pk.lost rect.b{fill:#ef5b5f;stroke:var(--ol);stroke-width:1.4}.pk.lost rect.s{fill:var(--ol)}.pk.lost text{fill:#fff}
.pk.gone{opacity:0;transition:opacity .45s}
.nt{animation:ntin .35s cubic-bezier(.2,.8,.2,1);transition:opacity .35s}
.nt rect{fill:var(--ink)}.nt text{fill:var(--bg);font:600 13px 'Space Grotesk','IBM Plex Sans KR',sans-serif;text-anchor:middle;dominant-baseline:central}
.nt.bad rect{fill:var(--red)}.nt.bad text{fill:#fff}.nt.out{opacity:0}
@keyframes ntin{from{opacity:0;transform:translateY(6px)}}
.ring{fill:none;stroke:var(--green);stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:ring .8s ease-out forwards}
@keyframes ring{from{transform:scale(.75);opacity:.85}to{transform:scale(1.5);opacity:0}}
/* reel */
.reel{position:fixed;inset:0;z-index:20;background:#05100b;display:grid;place-items:center;padding:16px}
.reel[hidden]{display:none}
.rframe{height:min(94vh,calc(92vw * 16 / 9));aspect-ratio:9/16;background:var(--mist);color:var(--ink);border-radius:8px;display:flex;flex-direction:column;padding:4% 5% 6%;gap:2.5%;overflow:hidden}
.rframe .segs{gap:5px}.rframe .seg{height:12px}
.rhead{display:flex;justify-content:space-between;font:600 15px 'Space Grotesk','IBM Plex Sans KR',sans-serif;color:var(--green-ink)}
.rframe .slot{flex:1;height:auto}
.rframe #stage{border-radius:14px}
.rcap h3{font:700 clamp(22px,3.4vh,32px)/1.15 'Space Grotesk','IBM Plex Sans KR',sans-serif;letter-spacing:-.02em;margin:0 0 6px}
.rcap p{margin:0;font-size:clamp(15px,2.1vh,19px);color:var(--muted)}
.rside{position:absolute;top:16px;right:16px;display:flex;gap:8px;align-items:center}
.rside .btn{color:#fff;background:#05100b}
.rhint{position:absolute;left:16px;bottom:10px;margin:0;color:#8fb5a2;font-size:13px}
@media(max-width:700px){.rhint{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="band top">
  <div><a class="home" id="home" href="/">← ZUPLY Learn</a><script>document.getElementById('home').href=location.hostname.startsWith('learn.')?'/':'/learn'</script>
    <h1>로그인하면 무슨 일이 일어날까</h1>
    <p>비밀번호를 입력하는 순간부터 로그인 상태가 유지되기까지. 해시, 세션, 토큰, 구글 로그인, 2단계 인증을 7단계로 따라가 보세요.</p>
  </div>
  <div class="ctl">
    <button class="btn" id="play">자동 재생</button>
    <button class="btn solid" id="reelBtn">릴스 모드</button>
  </div>
</header>
<main class="band main">
  <section>
    <div class="mets" id="mets"></div>
    <div class="slot" id="slotA"><div id="stage"><svg id="dia" role="img" aria-label="로그인과 인증 흐름도"><defs id="defs"></defs><g id="gZ"></g><g id="gE"></g><g id="gN"></g><g id="gP"></g></svg></div></div>
    <p class="note-s">시간은 대략값이며, 계정과 코드는 설명을 위한 예시입니다.</p>
  </section>
  <aside class="panel" aria-live="polite">
    <div class="segs" id="segs"></div>
    <p class="num" id="num"></p>
    <h2 id="ttl"></h2>
    <p id="txt"></p>
    <div class="key"><b>핵심</b><p id="key"></p></div>
    <div class="nav"><button class="btn" id="prev">이전</button><button class="btn solid" id="next">다음</button></div>
  </aside>
</main>
<section class="band toc">
  <h2>전체 흐름 <span class="h2en">Full flow</span></h2>
  <ol id="toc"></ol>
</section>
<div class="reel" id="reel" hidden>
  <div class="rframe">
    <div class="segs" id="segs2"></div>
    <div class="rhead"><span>Login and Authentication</span><span id="rnum"></span></div>
    <div class="slot" id="slotB"></div>
    <div class="rcap" lang="en"><h3 id="rttl"></h3><p id="rtxt"></p></div>
  </div>
  <div class="rside"><button class="btn" id="rplay">일시 정지</button><button class="btn" id="rclose">닫기</button></div>
  <p class="rhint">화면 녹화 후 가운데 9:16 영역만 잘라 릴스로 올리세요</p>
</div>
<script>
{
const $=id=>document.getElementById(id);
const DEV_EXTRA=(n,s)=>{let g='',top;const PAL=p=>[`url(#t-${p})`,`var(--${p}3)`,`var(--${p}4)`];
 if(n.t==='tray'){const p=n.p||'v',U=s*.46,V=s*.25,Z=s*.08,cz=Z*.6,cv=V*.74,ch=s*.3,cols=n.bad?['#f6f8fa','#f6f8fa','#f6f8fa','#e5484d']:['#f6f8fa','#f6f8fa','#f6f8fa','#ffc233'];
  const card=(k,c,front)=>{const u=k*U*.6;const face=`<path d="M${cv*.12} ${ch*.14}L${cv} ${ch*.5}L${cv*1.88} ${ch*.14}" fill="none" stroke="${c==='#f6f8fa'?'#8b97a0':'#5a2a00'}" stroke-width="1.3" stroke-linejoin="round"/>`+
    (n.bad&&front?`<path d="M${cv*.7} ${ch*.55}l${cv*.6} ${ch*.3}M${cv*1.3} ${ch*.55}l${-cv*.6} ${ch*.3}" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>`:'');
   return `<g transform="translate(${(u).toFixed(1)} ${(u*ISO).toFixed(1)})">${box(s*.022,cv,ch,cz,[c,c==='#f6f8fa'?'#d6dce1':c,c==='#f6f8fa'?'#e9eef2':c],{rf:face})}</g>`};
  g=csh(U,V)+box(U,V,Z,0,PAL(p))+[-1.5,-.5,.5,1.5].map((k,i)=>card(k,cols[i],i===3)).join('');
  top=-(-U*.6*1.5+cv)*ISO-cz-ch-s*.04}
 else if(n.t==='hub'){const p=n.p||'v',U=s*.3,Z=s*.14,r=s*.09,mz=s*.22;const sp=[[-1,0],[1,0],[0,-1],[0,1]].map(([a,b])=>`<path d="M0 0L${a*U*.72} ${b*U*.72}" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".9"/><circle cx="${a*U*.72}" cy="${b*U*.72}" r="${s*.04}" fill="#2ee58a" stroke="var(--ol)" stroke-width="1"/>`).join('');
  g=csh(U,U)+box(U,U,Z,0,PAL(p),{top:sp,rf:LED(U*.5,Z*.5,s*.02,'#2ee58a')+LED(U*.9,Z*.5,s*.02,'#2ee58a')+LED(U*1.3,Z*.5,s*.02,'#f5a300')})+

 const x0=clamp(Math.min(...ps.map(p=>p.x))-pad,4,W),x1=clamp(Math.max(...ps.map(p=>p.x))+pad,0,W-4),y0=clamp(Math.min(...ps.map(p=>p.y+p.t))-30,4,H),y1=clamp(Math.max(...ps.map(p=>p.y))+BOT+40,0,H-4);
 return `<g class="zn ${z.c||''}"><rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" rx="18"/><text x="${x0+14}" y="${y0+18}">${z.l}</text></g>`}).join('')}
function render(){W=svg.clientWidth;H=svg.clientHeight;if(!W||!H)return;port=H/W>1.05;S=clamp(Math.min(W,H)*(port?.155:.175)*(typeof SCALE==='number'?SCALE:1),34,96);
 HW=S*.82*.85;BOT=S*.82*ISO+S*.2;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
 gE.innerHTML=Object.entries(EDGES).map(([k,[a,b]])=>{const A=P(a),B=P(b),C=ctrl(a,b),d=`M${A.x} ${A.y}Q${C.x} ${C.y} ${B.x} ${B.y}`;return `<g class="e" id="e-${k}"><path class="ln" d="${d}" stroke-width="${S*.26}"/><path class="cl" d="${d}"/></g>`}).join('');
 gN.innerHTML=Object.keys(NODES).map(nodeSVG).join('');$('gZ').innerHTML=zoneSVG();
 gN.querySelectorAll('.lbl').forEach(t=>{let w;try{w=t.getComputedTextLength()}catch(_){w=0}w=(w||60)+24;const y=+t.getAttribute('y');const r=mk('rect',{class:'lblb',x:-w/2,y:y-13,width:w,height:26,rx:13});t.parentNode.insertBefore(r,t)});
 svg.querySelectorAll('.nd').forEach(n=>n.style.transition='none');apply();
 requestAnimationFrame(()=>svg.querySelectorAll('.nd').forEach(n=>n.style.transition=''))}
function edgeEl(a,b){return $('e-'+a+'-'+b)||$('e-'+b+'-'+a)}
function apply(){const st=STEPS[cur],stt=st.st||{};
 for(const id in NODES){const el=$('n-'+id);if(!el)continue;el.classList.toggle('on',st.show.includes(id));el.classList.toggle('off',stt[id]==='off');el.classList.toggle('dead',stt[id]==='dead')}
 svg.querySelectorAll('.e').forEach(e=>e.classList.remove('on','d','x','hot'));
 st.e.forEach(([a,b,f])=>{if(!st.show.includes(a)||!st.show.includes(b))return;const e=edgeEl(a,b);if(e){e.classList.add('on');if(f)e.classList.add(f)}})}
function mk(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function chip(g,text){const t=mk('text',{},g);t.textContent=text;let w;try{w=t.getComputedTextLength()}catch(_){w=0}w=(w||text.length*8)+22;
 const r=mk('rect',{class:'b',x:-w/2,y:-14,width:w,height:28,rx:14});g.insertBefore(r,t);return r}
function note(id,text,bad){const p=P(id),g=mk('g',{},gP),inner=mk('g',{class:'nt'+(bad?' bad':'')},g);chip(inner,text);
 let y=p.y+TOP[id]-22;if(y<18)y=p.y+BOT+52;g.setAttribute('transform',`translate(${clamp(p.x,90,W-90)},${y})`);
 setTimeout(()=>inner.classList.add('out'),1900);setTimeout(()=>g.remove(),2300)}
function pulse(id){const p=P(id),c=mk('ellipse',{class:'ring',cx:p.x,cy:p.y,rx:S*.95,ry:S*.95*ISO},gE);setTimeout(()=>c.remove(),800);
 const b=$('n-'+id)?.querySelector('.bd');if(b){b.classList.remove('bump');void b.getBBox();b.classList.add('bump')}}
function hop([a,b,label,kind],tok){return new Promise(res=>{
 const ps=mk('ellipse',{class:'psh',rx:S*.32,ry:S*.32*ISO},gP);
 const g=mk('g',{class:'pk'+(kind?' '+kind:'')},gP),sh=mk('g',{transform:'translate(0,4)'},g);
 const r=chip(g,label);const s=r.cloneNode();s.setAttribute('class','s');sh.appendChild(s);
 const A0=P(a),B0=P(b),dist=Math.hypot(B0.x-A0.x,B0.y-A0.y),dur=RM?1:clamp(dist*1.6,600,1200);
 const e=edgeEl(a,b);if(e)e.classList.add('hot');let t0=null;
 const end=ok=>{if(e)e.classList.remove('hot');res(ok)};
 const step=ts=>{if(tok!==tk){g.remove();ps.remove();return end(false)}
  if(t0===null)t0=ts;const t=Math.min(1,(ts-t0)/dur),k=t<.5?4*t*t*t:1-((-2*t+2)**3)/2;
  const q=qp(P(a),ctrl(a,b),P(b),k),lift=S*.32+Math.sin(Math.PI*k)*S*.28,sc=1-Math.sin(Math.PI*k)*.25;
  ps.setAttribute('cx',q.x);ps.setAttribute('cy',q.y);ps.setAttribute('transform',`translate(${q.x} ${q.y}) scale(${sc}) translate(${-q.x} ${-q.y})`);
  g.setAttribute('transform',`translate(${q.x},${q.y-lift})`);
  if(kind==='lost'&&t>.55){g.classList.add('gone');ps.remove();const ng=mk('g',{transform:`translate(${q.x},${q.y-lift-34})`},gP),ni=mk('g',{class:'nt bad'},ng);chip(ni,'Lost');setTimeout(()=>ni.classList.add('out'),1300);setTimeout(()=>ng.remove(),1700);setTimeout(()=>g.remove(),500);return end(true)}
  if(t<1)requestAnimationFrame(step);else{g.remove();ps.remove();pulse(b);end(true)}};
 requestAnimationFrame(step)})}
async function item(it,tok){if(Array.isArray(it))return hop(it,tok);
 if(it.p)return Promise.all(it.p.map(h=>hop(h,tok)));
 if(it.n){note(it.n[0],it.n[1],/erased|down|Crashed/i.test(it.n[1]));return sleep(RM?900:700)}
 if(it.w)return sleep(it.w)}
async function run(tok){for(;;){for(const it of STEPS[cur].f){if(tok!==tk)return;await item(it,tok);if(tok!==tk)return;await sleep(140)}
 await sleep(1300);if(tok!==tk)return;if(auto){go(cur+1);return}}}
function fill(id,text){const e=$(id);e.textContent=text;e.classList.remove('fade');void e.offsetWidth;e.classList.add('fade')}
function segs(el){el.innerHTML=STEPS.map((s,i)=>`<button class="seg${i<=cur?' done':''}" data-i="${i}" aria-label="${i+1}단계: ${s.t}"><i></i></button>`).join('')}
function panel(){const st=STEPS[cur];$('num').textContent=`${cur+1} / ${STEPS.length}단계`;fill('ttl',st.t);fill('txt',st.x);fill('key',st.k);
 fill('rttl',st.te);fill('rtxt',st.se);$('rnum').textContent=`${cur+1} / ${STEPS.length}`;segs($('segs'));segs($('segs2'));
 const old=[...document.querySelectorAll('.met b')].map(b=>b.textContent);
 $('mets').innerHTML=st.m.map((v,i)=>{const c=/사라|지워/.test(v)?'bad':/남음/.test(v)?'good':'';
  return `<div class="met"><span>${MLAB[i]}</span><b class="${c}${old[i]!==v?' flip':''}">${v}</b></div>`}).join('');
 $('prev').disabled=cur===0;$('next').textContent=cur===STEPS.length-1?'처음부터':'다음';
 document.querySelectorAll('#toc button').forEach((b,i)=>b.classList.toggle('cur',i===cur))}
function go(i){cur=(i+STEPS.length)%STEPS.length;tk++;gP.innerHTML='';apply();panel();
 try{history.replaceState(null,'','#step-'+(cur+1))}catch(_){}run(tk)}
function setAuto(v){auto=v;$('play').textContent=v?'일시 정지':'자동 재생';$('rplay').textContent=v?'일시 정지':'자동 재생'}
$('toc').innerHTML=STEPS.map((s,i)=>`<li><button data-i="${i}"><small>${i+1}단계 · Step ${i+1}</small><strong>${s.t}</strong><em lang="en">${s.te}</em><span>${s.s}</span><span class="en" lang="en">${s.se}</span></button></li>`).join('');
document.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;go(+b.dataset.i);if(b.closest('#toc')&&$('reel').hidden)$('slotA').scrollIntoView({behavior:RM?'auto':'smooth',block:'center'})});
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);
$('play').onclick=()=>setAuto(!auto);$('rplay').onclick=()=>setAuto(!auto);
const stage=$('stage');
function openReel(){$('reel').hidden=false;$('slotB').appendChild(stage);setAuto(true);go(cur)}
function closeReel(){$('reel').hidden=true;$('slotA').appendChild(stage);setAuto(false);go(cur)}
$('reelBtn').onclick=openReel;$('rclose').onclick=closeReel;
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);else if(e.key==='Escape'&&!$('reel').hidden)closeReel();else if(e.key===' '&&e.target===document.body){e.preventDefault();setAuto(!auto)}});
const ro=new ResizeObserver(()=>render());ro.observe(svg);
const m=/^#step-(\d+)$/.exec(location.hash);cur=m?clamp(+m[1]-1,0,STEPS.length-1):0;
render();go(cur);
if(document.fonts)document.fonts.ready.then(render);
}
</script>
